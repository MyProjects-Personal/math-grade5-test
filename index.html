        .qr-modal-content { background: white; border-radius: 24px; padding: 30px; text-align: center; max-width: 400px; width: 100%; }
        .qr-code-container { background: #f7fafc; padding: 20px; border-radius: 16px; display: inline-block; margin-bottom: 20px; border: 2px dashed #cbd5e0; }
        .qr-code-container img { display: block; width: 220px; height: 220px; }
        .qr-url-box { background: #edf2f7; padding: 10px 15px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; word-break: break-all; color: #4a5568; margin-bottom: 20px; }
        .qr-close-btn, .qr-copy-btn { border: none; border-radius: 50px; padding: 10px 30px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        .qr-close-btn { background: #e2e8f0; color: #2d3748; }
        .qr-copy-btn { background: #667eea; color: white; margin-right: 10px; }
        .info-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: #f7fafc; padding: 15px 20px; border-radius: 60px; margin-bottom: 30px; border: 1px solid #e2e8f0; }

        .question-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px 25px; margin-bottom: 20px; }

        .question-text img { max-width: 100%; height: auto; margin: 12px 0; border-radius: 8px; display: block; }
        .options { display: flex; flex-wrap: wrap; gap: 12px; }
        .option { display: flex; align-items: center; background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 40px; padding: 10px 20px; cursor: pointer; transition: 0.2s; flex: 1 0 180px; font-size: 1rem; user-select: none; }
        .option:hover { background: #ebf4ff; border-color: #90cdf4; }
        .option input[type="radio"] { margin-right: 12px; accent-color: #667eea; width: 18px; height: 18px; cursor: pointer; }
        .option.selected { background: #ebf4ff; border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,0.3); }
        .btn-group { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .btn { padding: 14px 40px; font-size: 1.1rem; font-weight: 600; border: none; border-radius: 50px; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #667eea; color: white; box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
        .btn-primary:hover { background: #5a67d8; transform: translateY(-2px); }
        .btn-secondary { background: #e2e8f0; color: #2d3748; }
        .btn-secondary:hover { background: #cbd5e0; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .result-box { display: none; background: #f0fff4; border: 2px solid #68d391; border-radius: 20px; padding: 25px; margin-top: 30px; text-align: center; }
        .result-box h2 { color: #276749; margin-top: 0; }
        .result-box p { font-size: 1.3rem; color: #2f855a; }
        .result-box .score { font-size: 2.5rem; font-weight: 800; color: #38a169; }
        .section-title { font-size: 1.5rem; font-weight: 700; color: #2d3748; margin: 35px 0 20px 0; padding-bottom: 8px; border-bottom: 2px dashed #cbd5e0; }
        .teacher-fab { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 999; background: #ed8936; color: white; border: none; border-radius: 50px; padding: 15px 28px; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 6px 20px rgba(237,137,54,0.5); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: flex-start; padding: 40px 20px; overflow-y: auto; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 24px; max-width: 950px; width: 100%; padding: 30px 35px; margin: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #ed8936; padding-bottom: 15px; margin-bottom: 20px; }

        .close-btn { background: #fed7d7; color: #c53030; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 1.4rem; cursor: pointer; font-weight: bold; }
        .student-list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }

        .search-input { border: 1px solid #cbd5e0; border-radius: 30px; padding: 8px 18px; font-size: 0.9rem; outline: none; width: 200px; }
        .clear-all-btn { background: #fed7d7; color: #c53030; border: none; border-radius: 30px; padding: 8px 18px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .student-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; max-height: 350px; overflow-y: auto; padding: 5px; }

        .student-card:hover { border-color: #667eea; background: #ebf4ff; }
        .student-card .s-name { font-weight: 700; color: #2d3748; font-size: 1rem; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .student-card .s-name .s-score { background: #48bb78; color: white; font-size: 0.75rem; padding: 2px 8px; border-radius: 20px; }
        .student-card .s-meta { font-size: 0.75rem; color: #718096; display: flex; justify-content: space-between; }
        .no-students { text-align: center; color: #a0aec0; padding: 30px; font-style: italic; grid-column: 1 / -1; }
        .teacher-summary { background: #fffaf0; border: 1px solid #fbd38d; border-radius: 12px; padding: 15px 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; }
        .teacher-summary span { font-weight: 600; color: #7b341e; }
        .teacher-summary .val { color: #c05621; }
        .teacher-question-row { border-bottom: 1px solid #e2e8f0; padding: 12px 0; }
        .teacher-q-text { font-size: 0.95rem; color: #2d3748; font-weight: 500; margin-bottom: 8px; }
        .teacher-ans-detail { font-size: 0.85rem; color: #4a5568; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .teacher-toggle { margin-left: auto; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.9rem; }
        .teacher-feedback input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 0.9rem; margin-top: 8px; }
        .teacher-actions { display: flex; gap: 15px; justify-content: flex-end; margin-top: 25px; flex-wrap: wrap; }
        .btn-orange { background: #ed8936; color: white; }
        .btn-sm { padding: 10px 24px; font-size: 0.95rem; }
        .teacher-result-override { margin-top: 15px; padding: 15px; background: #ebf8ff; border-radius: 12px; text-align: center; font-size: 1.2rem; font-weight: 700; color: #2b6cb0; }

        .passcode-modal.active { display: flex; }
        .passcode-content { background: white; border-radius: 20px; padding: 35px; max-width: 380px; width: 100%; text-align: center; }
        .passcode-content h3 { margin-top: 0; color: #2d3748; }

        .passcode-content .error { color: #e53e3e; font-size: 0.85rem; margin-bottom: 10px; min-height: 18px; }
        .passcode-actions { display: flex; gap: 10px; }
        .passcode-actions button { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        .passcode-submit { background: #667eea; color: white; }
        .passcode-cancel { background: #e2e8f0; color: #2d3748; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; }
        .status-online { background: #c6f6d5; color: #22543d; }
        .status-offline { background: #fed7d7; color: #742a2a; }
        .status-syncing { background: #fefcbf; color: #744210; }
        @media (max-width: 600px) {
            .container { padding: 20px 15px; }
            h1 { font-size: 1.5rem; }
            .info-bar { flex-direction: column; gap: 12px; align-items: stretch; }
            .info-bar input { width: 100%; }
            .option { flex: 1 0 100%; }
            .btn { width: 100%; }
            .student-list { grid-template-columns: 1fr; }
        }
    </style>
</head>

        const questionsContainer = $('questionsContainer');
        const submitBtn = $('submitBtn');
        const resetBtn = $('resetBtn');
        const resultBox = $('resultBox');
        const scoreDisplay = $('scoreDisplay');
        const totalDisplay = $('totalDisplay');
        const studentNameDisplay = $('studentNameDisplay');
        const timeTakenDisplay = $('timeTakenDisplay');
        const cloudSaveStatus = $('cloudSaveStatus');
        const cloudStatus = $('cloudStatus');

        // ----- Firebase Init -----
        function initFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                firebaseReady = true;
                updateCloudStatus('online', '● Cloud Connected');
                db.ref('.info/connected').on('value', snap => {
                    updateCloudStatus(snap.val() === true ? 'online' : 'syncing',
                        snap.val() === true ? '● Cloud Connected' : '● Reconnecting...');
                });
            } catch (e) {
                console.error('Firebase init error:', e);
                updateCloudStatus('offline', '● Offline');
            }
        }
        function updateCloudStatus(type, text) {
            cloudStatus.className = 'status-badge status-' + type;
            cloudStatus.textContent = text;
        }

        // ----- Render Questions -----
        function renderQuestions() {
            questionsContainer.innerHTML = '';
            questionsData.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `<div class="question-text"><strong>Q${index + 1}.</strong> ${q.q}</div>`;
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';
                q.o.forEach((opt, i) => {
                    const label = document.createElement('label');
                    label.className = 'option';
                    const radio = document.createElement('input');
                    radio.type = 'radio'; radio.name = `q${index}`; radio.value = i;
                    radio.addEventListener('change', function() {
                        this.closest('.options').querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
                        this.closest('.option').classList.add('selected');
                    });
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(opt));
                    optionsDiv.appendChild(label);
                });
                card.appendChild(optionsDiv);
                questionsContainer.appendChild(card);
            });
            totalDisplay.textContent = questionsData.length;
        }

        // ----- Timer -----
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            secondsElapsed = 0; updateTimerDisplay();
            timerInterval = setInterval(() => { secondsElapsed++; updateTimerDisplay(); }, 1000);
        }
        function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
        function updateTimerDisplay() {
            const m = Math.floor(secondsElapsed / 60), s = secondsElapsed % 60;
            timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        function formatTime(sec) {
            const m = Math.floor(sec / 60), s = sec % 60;
            return m === 0 ? `${s} seconds` : `${m} min ${s} sec`;
        }

        // ----- Submit -----
        async function submitTest() {
            if (quizSubmitted) return;
            const name = studentNameInput.value.trim();
            if (!name) { alert('Please enter your name before submitting.'); studentNameInput.focus(); return; }

            stopTimer();
            quizSubmitted = true;

            autoScore = 0;
            studentAnswers = {};
            questionsData.forEach((q, i) => {
                const sel = document.querySelector(`input[name="q${i}"]:checked`);
                const val = sel ? parseInt(sel.value) : -1;
                studentAnswers[i] = val;
                if (val === getCorrectAnswer(i)) autoScore++;
            });

            const studentId = name.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_' + Date.now();
            const submission = {
                id: studentId, name, timestamp: Date.now(),
                timeTaken: secondsElapsed, autoScore,
                total: questionsData.length, answers: studentAnswers,
                corrected: false, finalScore: autoScore
            };

            if (firebaseReady && db) {
                try {
                    cloudSaveStatus.textContent = '☁️ Saving to cloud...';
                    await db.ref('submissions/' + studentId).set(submission);
                    cloudSaveStatus.innerHTML = '<span style="color:#38a169;">✅ Saved to cloud successfully</span>';
                } catch (e) {
                    console.error(e);
                    cloudSaveStatus.innerHTML = '<span style="color:#e53e3e;">⚠️ Cloud save failed.</span>';
                }
            } else {
                cloudSaveStatus.innerHTML = '<span style="color:#e53e3e;">⚠️ Cloud not connected.</span>';
            }

            studentNameDisplay.textContent = `Student: ${name}`;
            scoreDisplay.textContent = autoScore;
            totalDisplay.textContent = questionsData.length;
            timeTakenDisplay.textContent = `Time taken: ${formatTime(secondsElapsed)}`;
            resultBox.style.display = 'block';

            document.querySelectorAll('input[type="radio"]').forEach(el => el.disabled = true);
            submitBtn.disabled = true;
            studentNameInput.disabled = true;
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetTest() {
            stopTimer(); secondsElapsed = 0; updateTimerDisplay();
            quizSubmitted = false; autoScore = 0; studentAnswers = {}; currentStudentId = '';
            document.querySelectorAll('input[type="radio"]').forEach(el => { el.checked = false; el.disabled = false; });
            document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
            studentNameInput.value = ''; studentNameInput.disabled = false;
            resultBox.style.display = 'none'; submitBtn.disabled = false;
            cloudSaveStatus.textContent = '';
            startTimer(); window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ----- QR -----
        function generateQRCode() {
            const url = window.location.href;
            $('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url)}`;
            $('qrUrlBox').textContent = url;
        }

        // ----- Passcode -----
        function showPasscodeModal() {
            $('passcodeInput').value = ''; $('passcodeError').textContent = '';
            $('passcodeModal').classList.add('active');
            setTimeout(() => $('passcodeInput').focus(), 100);
        }
        function verifyPasscode() {
            if ($('passcodeInput').value.trim() === TEACHER_PASSCODE) {
                teacherUnlocked = true;
                $('passcodeModal').classList.remove('active');
                openTeacherPanel();
            } else {
                $('passcodeError').textContent = '❌ Incorrect passcode.';
                $('passcodeInput').value = ''; $('passcodeInput').focus();
            }
        }

        // ----- Teacher Panel -----
        function openTeacherPanel() {
            if (!teacherUnlocked) { showPasscodeModal(); return; }
            // Inject teacher panel HTML ONLY now (not visible in page source to students)
            $('teacherPanelContent').innerHTML = `
                <div class="modal-header">
                    <h2>👩‍🏫 Teacher Correction Panel</h2>
                    <button class="close-btn" id="closeTeacherPanel">×</button>
                </div>
                <div id="studentListView">
                    <div class="student-list-header">
                        <h3>📋 Submitted Tests (<span id="studentCount">0</span>)</h3>
                        <div>
                            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search by name...">
                            <button class="clear-all-btn" id="clearAllBtn" style="margin-left:8px;">🗑️ Clear All</button>
                        </div>
                    </div>
                    <div class="student-list" id="studentList"><div class="loading">☁️ Loading from cloud...</div></div>
                </div>
                <div id="studentDetailView" style="display:none;">
                    <button class="back-btn" id="backBtn">← Back to Student List</button>
                    <div class="teacher-summary">
                        <div>Student: <span class="val" id="teacherStudentName">—</span></div>
                        <div>Auto Score: <span class="val" id="teacherAutoScore">—</span></div>
                        <div>Adjusted Score: <span class="val" id="teacherAdjustedScore">—</span></div>
                        <div>Time Taken: <span class="val" id="teacherTimeTaken">—</span></div>
                    </div>
                    <div id="teacherQuestionsContainer"></div>
                    <div class="teacher-result-override">Final Adjusted Score: <span id="teacherFinalScore">0</span> / <span id="teacherTotalQ">0</span></div>
                    <div class="teacher-actions">
                        <button class="btn btn-orange btn-sm" id="saveCorrectionBtn">💾 Save Correction</button>
                        <button class="btn btn-secondary btn-sm" id="printCorrectionBtn">🖨️ Print Report</button>
                        <button class="btn btn-secondary btn-sm" id="deleteStudentBtn" style="background:#fed7d7;color:#c53030;">🗑️ Delete</button>
                    </div>
                </div>
            `;
            // Now attach listeners
            $('closeTeacherPanel').addEventListener('click', () => $('teacherPanel').classList.remove('active'));
            $('backBtn').addEventListener('click', showStudentList);
            $('searchInput').addEventListener('input', () => {
                if (firebaseReady && db) db.ref('submissions').once('value').then(s => renderStudentList(s.val() || {}));
            });
            $('clearAllBtn').addEventListener('click', clearAllSubmissions);
            $('saveCorrectionBtn').addEventListener('click', saveCorrection);
            $('printCorrectionBtn').addEventListener('click', printCorrectionReport);
            $('deleteStudentBtn').addEventListener('click', deleteCurrentStudent);
            $('teacherPanel').classList.add('active');
            showStudentList();
        }

        function showStudentList() {
            $('studentListView').style.display = 'block';
            $('studentDetailView').style.display = 'none';
            loadStudentsFromCloud();
        }
        function loadStudentsFromCloud() {
            if (!firebaseReady || !db) return;
            $('studentList').innerHTML = '<div class="loading">☁️ Loading from cloud...</div>';
            db.ref('submissions').on('value', snapshot => renderStudentList(snapshot.val() || {}));
        }
        function renderStudentList(data) {
            const filter = ($('searchInput').value || '').toLowerCase().trim();
            let list = Object.values(data);
            if (filter) list = list.filter(s => s.name.toLowerCase().includes(filter));
            list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            $('studentCount').textContent = list.length;
            const container = $('studentList'); container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = '<div class="no-students">No tests submitted yet.</div>'; return;
            }
            list.forEach(s => {
                const card = document.createElement('div');
                card.className = 'student-card';
                const correctedLabel = s.corrected ? '<span style="color:#ed8936;font-weight:700;">✓ Corrected</span>' : '<span style="color:#a0aec0;">Pending</span>';
                card.innerHTML = `
                    <div class="s-name"><span>${escapeHtml(s.name)}</span><span class="s-score">${s.finalScore || s.autoScore}/${s.total}</span></div>
                    <div class="s-meta"><span>${new Date(s.timestamp).toLocaleString()}</span>${correctedLabel}</div>
                `;
                card.addEventListener('click', () => showStudentDetail(s));
                container.appendChild(card);
            });
        }
        function showStudentDetail(student) {
            currentStudentId = student.id;
            currentStudentData = student;
            studentAnswers = student.answers || {};
            correctionState = student.corrections || {};
            questionsData.forEach((q, i) => {
                if (!(i in correctionState)) correctionState[i] = (studentAnswers[i] === getCorrectAnswer(i));
            });
            $('teacherStudentName').textContent = student.name;
            $('teacherAutoScore').textContent = `${student.autoScore} / ${questionsData.length}`;
            $('teacherTimeTaken').textContent = formatTime(student.timeTaken);
            renderTeacherCorrectionList(); updateAdjustedScore();
            $('studentListView').style.display = 'none';
            $('studentDetailView').style.display = 'block';
        }
        function renderTeacherCorrectionList() {
            const container = $('teacherQuestionsContainer'); container.innerHTML = '';
            questionsData.forEach((q, i) => {
                const sa = studentAnswers[i];
                const saText = sa >= 0 ? q.o[sa] : 'Not Answered';
                const correctIdx = getCorrectAnswer(i);
                const correctText = correctIdx >= 0 ? q.o[correctIdx] : '?';
                const row = document.createElement('div');
                row.className = 'teacher-question-row';
                row.innerHTML = `
                    <div class="teacher-q-text"><strong>Q${i + 1}.</strong> ${q.q.replace(/<[^>]*>/g, '').substring(0, 100)}${q.q.length > 100 ? '...' : ''}</div>
                    <div class="teacher-ans-detail">
                        <span>Student: <span style="color:#2b6cb0;font-weight:600;">${escapeHtml(saText)}</span></span>
                        <span>Correct: <span style="color:#276749;font-weight:600;">${escapeHtml(correctText)}</span></span>
                        <span class="teacher-toggle"><input type="checkbox" data-index="${i}" ${correctionState[i] ? 'checked' : ''}><span>Mark Correct</span></span>
                    </div>
                    <div class="teacher-feedback"><input type="text" data-index="${i}" placeholder="Add feedback..." value="${(currentStudentData.feedbacks && currentStudentData.feedbacks[i]) || ''}"></div>
                `;
                container.appendChild(row);
            });
            container.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', function() {
                    correctionState[parseInt(this.dataset.index)] = this.checked;
                    updateAdjustedScore();
                });
            });
        }
        function updateAdjustedScore() {
            let adj = 0; Object.keys(correctionState).forEach(k => { if (correctionState[k]) adj++; });
            $('teacherAdjustedScore').textContent = `${adj} / ${questionsData.length}`;
            $('teacherFinalScore').textContent = adj;
        }
        async function saveCorrection() {
            if (!currentStudentId || !firebaseReady) return;
            const feedbacks = {};
            document.querySelectorAll('.teacher-feedback input').forEach(input => {
                feedbacks[parseInt(input.dataset.index)] = input.value.trim();
            });
            let finalScore = 0;
            Object.keys(correctionState).forEach(k => { if (correctionState[k]) finalScore++; });
            try {
                await db.ref('submissions/' + currentStudentId).update({
                    corrections: correctionState, feedbacks, corrected: true,
                    finalScore, correctedAt: Date.now()
                });
                alert(`✅ Correction saved for ${currentStudentData.name}!\nFinal Score: ${finalScore} / ${questionsData.length}`);
            } catch (e) { alert('Error saving.'); }
        }
        function printCorrectionReport() {
            if (!currentStudentData) return;
            const s = currentStudentData;
            const w = window.open('', '_blank', 'width=900,height=700');
            let html = `<html><head><title>Report - ${escapeHtml(s.name)}</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:0.9rem}th{background:#edf2f7}.c{color:#276749;font-weight:bold}.i{color:#c53030;font-weight:bold}</style></head><body><h1>Correction Report</h1><p><b>Student:</b> ${escapeHtml(s.name)}</p><p><b>Auto:</b> ${s.autoScore} / ${questionsData.length}</p><p><b>Final:</b> ${s.finalScore} / ${questionsData.length}</p><table><thead><tr><th>#</th><th>Question</th><th>Student</th><th>Correct</th><th>Status</th><th>Feedback</th></tr></thead><tbody>`;
            questionsData.forEach((q, i) => {
                const sa = s.answers[i];
                const isCorrect = s.corrections && s.corrections[i] !== undefined ? s.corrections[i] : (sa === getCorrectAnswer(i));
                const fb = (s.feedbacks && s.feedbacks[i]) || '';
                html += `<tr><td>${i + 1}</td><td>${q.q.replace(/<[^>]*>/g, '')}</td><td>${escapeHtml(sa >= 0 ? q.o[sa] : 'N/A')}</td><td>${escapeHtml(q.o[getCorrectAnswer(i)])}</td><td class="${isCorrect ? 'c' : 'i'}">${isCorrect ? '✅' : '❌'}</td><td>${escapeHtml(fb)}</td></tr>`;
            });
            html += `</tbody></table></body></html>`;
            w.document.write(html); w.document.close();
            setTimeout(() => w.print(), 500);
        }
        async function deleteCurrentStudent() {
            if (!currentStudentId || !firebaseReady) return;
            if (!confirm(`Delete test for "${currentStudentData.name}"?`)) return;
            try { await db.ref('submissions/' + currentStudentId).remove(); currentStudentId = ''; currentStudentData = null; showStudentList(); }
            catch (e) { alert('Error deleting.'); }
        }
        async function clearAllSubmissions() {
            if (!firebaseReady) return;
            if (!confirm('⚠️ Delete ALL submissions?')) return;
            if (!confirm('Really sure?')) return;
            try { await db.ref('submissions').remove(); showStudentList(); }
            catch (e) { alert('Error.'); }
        }
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // ----- Event Listeners -----
        submitBtn.addEventListener('click', submitTest);
        resetBtn.addEventListener('click', resetTest);
        $('qrBtn').addEventListener('click', () => { generateQRCode(); $('qrModal').classList.add('active'); });
        $('qrCloseBtn').addEventListener('click', () => $('qrModal').classList.remove('active'));
        $('copyUrlBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                $('copyUrlBtn').textContent = '✅ Copied!';
                setTimeout(() => $('copyUrlBtn').textContent = '📋 Copy Link', 2000);
            });
        });
        $('qrModal').addEventListener('click', e => { if (e.target === $('qrModal')) $('qrModal').classList.remove('active'); });
        $('teacherFab').addEventListener('click', openTeacherPanel);
        $('passcodeSubmit').addEventListener('click', verifyPasscode);
        $('passcodeCancel').addEventListener('click', () => $('passcodeModal').classList.remove('active'));
        $('passcodeInput').addEventListener('keydown', e => { if (e.key === 'Enter') verifyPasscode(); });

        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'L' || e.key === 'l')) {
                e.preventDefault();
                $('teacherFab').classList.add('visible');
                if (teacherUnlocked) openTeacherPanel(); else showPasscodeModal();
            }
        });

        // 5-Tap on title
        let titleTapCount = 0, titleTapTimer = null;
        const titleEl = document.getElementById('mainTitle');
        titleEl.addEventListener('click', () => {
            titleTapCount++;
            clearTimeout(titleTapTimer);
            titleTapTimer = setTimeout(() => { titleTapCount = 0; }, 1500);
            if (titleTapCount >= 5) {
                titleTapCount = 0;
                $('teacherFab').classList.add('visible');
                if (teacherUnlocked) openTeacherPanel(); else showPasscodeModal();
            }
        });

        $('teacherPanel').addEventListener('click', e => { if (e.target === $('teacherPanel')) $('teacherPanel').classList.remove('active'); });
        studentNameInput.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });

        // ----- Init -----
        renderQuestions();
        startTimer();
        initFirebase();
    </script>
</body>
</html>
